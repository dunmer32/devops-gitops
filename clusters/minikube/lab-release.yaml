apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lab
  namespace: flux-system
spec:
  interval: 1m
  timeout: 5m
  releaseName: lab
  targetNamespace: lab-flux
  chart:
    spec:
      chart: ./charts/devops-lab
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    replicaCount: 2
    appVersion: "7dc6b787a21171afa61204e14ca6b42d83b76dc0"
    image:
      repository: "ghcr.io/dunmer32/devops-lab"
      tag: "7dc6b787a21171afa61204e14ca6b42d83b76dc0"
    serviceMonitor:
      enabled: true
