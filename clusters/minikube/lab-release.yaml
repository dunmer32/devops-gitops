apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lab
  namespace: flux-system
spec:
  interval: 1m
  timeout: 5m
  releaseName: lab
  targetNamespace: lab-flux
  chart:
    spec:
      chart: ./charts/devops-lab
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    replicaCount: 3
    appVersion: "3f050ef4af16715189b5bd17832a6e3730310c4e"
    image:
      repository: "ghcr.io/dunmer32/devops-lab"
      tag: "3f050ef4af16715189b5bd17832a6e3730310c4e"
    serviceMonitor:
      enabled: true
